name: Android debug APK

# Builds the real APK on GitHub's runners, where the Android SDK and Gradle exist.
# Nothing is published: the APK is uploaded as a workflow artifact and expires.

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The emulator job below needs to commit its screenshots; that is granted per job, not globally.

jobs:
  build-debug-apk:
    name: Test, build and verify the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No third-party SDK action: ubuntu runners ship the SDK and cmdline-tools.
      # If they ever stop shipping it, the fallback fetches Google's cmdline-tools.
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then
                ANDROID_HOME="$candidate"
                break
              fi
            done
          fi
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found; downloading cmdline-tools" >&2
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Summarise unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          tests = failures = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"::notice title=Unit tests::tests={tests} failures={failures} skipped={skipped}")
          print(f"unit tests: {tests} tests, {failures} failures, {skipped} skipped")
          if failures:
              raise SystemExit(1)
          PY

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify the APK
        run: |
          set -uo pipefail
          : "${ANDROID_HOME:?Android SDK not configured}"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::no APK at $APK"
            ls -R app/build/outputs || true
            exit 1
          fi

          ls -l "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "::notice title=APK artifact::sha256=$SHA size=$SIZE bytes path=$APK"

          "$BT/aapt2" dump badging "$APK" | tee apk-badging.txt || true
          unzip -l "$APK" | tee apk-contents.txt || true
          "$BT/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt 2>&1 || true
          cat apk-signature.txt

          status=0
          expect() { # file, fixed-pattern, label
            if grep -qF -- "$2" "$1"; then
              echo "ok: $3"
            else
              echo "::error::APK verification failed: $3 not found in $1"
              echo "::notice::$3 pattern was: $2"
              sed -n '1,40p' "$1" | while IFS= read -r line; do echo "::notice::  $line"; done
              status=1
            fi
          }
          expect apk-badging.txt "package: name='app.phonecare.diagnostics'" "package name"
          expect apk-badging.txt "minSdkVersion:'26'" "minSdk 26"
          expect apk-badging.txt "targetSdkVersion:'35'" "targetSdk 35"
          expect apk-badging.txt "launchable-activity: name='app.phonecare.diagnostics.MainActivity'" "launcher activity"
          expect apk-contents.txt "classes.dex" "classes.dex in the archive"
          expect apk-contents.txt "resources.arsc" "resources.arsc in the archive"
          expect apk-signature.txt "Verified using v2 scheme (APK Signature Scheme v2): true" "v2 signature"
          expect apk-signature.txt "Verifies" "apksigner overall verdict"
          exit "$status"

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonecare-debug-apk
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/apk-sha256.txt
            native/android/apk-badging.txt
            native/android/apk-contents.txt
            native/android/apk-signature.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: native/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

  ui-walk:
    name: Walk every screen on an emulator
    # Physical-device testing is impossible in CI, so this provisions an emulator directly rather
    # than through a wrapper action: every provisioning command, the boot wait and the walk all
    # land in docs/testing/evidence/emulator/walk.log, which is committed even on failure.
    # This is emulator evidence, not a handset.
    needs: build-debug-apk
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK from the build job
        uses: actions/download-artifact@v4
        with:
          name: phonecare-debug-apk
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Confirm KVM is usable
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error title=KVM::/dev/kvm is missing on this runner; an x86_64 emulator cannot boot"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Provision the emulator
        timeout-minutes: 25
        run: |
          set -x
          mkdir -p docs/testing/evidence/emulator
          LOG=docs/testing/evidence/emulator/walk.log
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          {
            echo "== provisioning $(date -u +%FT%TZ)"
            echo "SDK=$ANDROID_HOME"
            adb version
            yes | timeout 300 sdkmanager --licenses > /dev/null 2>&1 || true
            # A truncated package download ('Error on ZipFile unknown archive') fails the run
            # before anything is tested, so give the download a second and third chance.
            for attempt in 1 2 3; do
              echo "sdkmanager attempt $attempt"
              if timeout 900 sdkmanager --install "platform-tools" "emulator" \
                   "system-images;android-34;google_apis;x86_64" 2>&1 | tail -3; then
                if [ -d "$ANDROID_HOME/system-images/android-34/google_apis/x86_64" ]; then
                  echo "system image present"; break
                fi
              fi
              sleep 10
            done
            [ -d "$ANDROID_HOME/system-images/android-34/google_apis/x86_64" ] \
              || { echo "::error::system image never installed"; exit 1; }
            echo no | timeout 120 avdmanager create avd -n walk \
              -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
            echo "--- avdmanager list ---"; avdmanager list avd | head -12
            avdmanager list avd | grep -q "walk" || { echo "::error::AVD walk was not created"; exit 1; }
            # avdmanager and the emulator disagree about where $ANDROID_AVD_HOME points unless it
            # is set explicitly, so find the .ini that was just written and use its directory.
            AVD_INI=$(find "$HOME" /root/.android -maxdepth 5 -name walk.ini 2>/dev/null | head -1)
            echo "avd ini: ${AVD_INI:-not found}"
            if [ -n "$AVD_INI" ]; then export ANDROID_AVD_HOME=$(dirname "$AVD_INI"); fi
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
            emulator -list-avds
            adb start-server
            nohup "$ANDROID_HOME/emulator/emulator" -avd walk -no-window -no-audio -no-boot-anim \
              -no-snapshot -gpu swiftshader_indirect -no-metrics -camera-back none -camera-front none \
              > /tmp/emulator.log 2>&1 &
            echo "emulator pid $!"
            for i in $(seq 1 60); do
              adb devices | grep -q "emulator.*device" && break
              sleep 5
            done
            echo "devices after ~$((i*5))s:"; adb devices
            booted=0
            for i in $(seq 1 120); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && { booted=1; break; }
              sleep 5
            done
            echo "boot_completed=$booted after ~$((i*5))s"
            adb shell wm dismiss-keyguard || true
            echo "== emulator log tail"; tail -30 /tmp/emulator.log
            echo "== run ${GITHUB_RUN_ID:-local} at $(date -u +%FT%TZ)"
          } 2>&1 | tee -a "$LOG"
          adb devices | grep -q "emulator.*device" || { echo "::error::no emulator device attached"; exit 1; }
          grep -q "boot_completed=1" "$LOG" || { echo "::error::emulator never finished booting"; exit 1; }

      - name: Walk the app on the emulator
        timeout-minutes: 30
        run: |
          set -x
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb devices
          python3 native/android/ui-walk.py 2>&1 | tee -a docs/testing/evidence/emulator/walk.log
          exit ${PIPESTATUS[0]}

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-walk
          path: docs/testing/evidence/emulator
          if-no-files-found: warn
          retention-days: 30

      - name: Publish evidence back to the branch
        if: always()
        run: |
          if [ -f /tmp/emulator.log ]; then
            cp /tmp/emulator.log docs/testing/evidence/emulator/emulator-boot.log
          fi
          git config user.name "phonecare-ci"
          git config user.email "ci@phonecare.invalid"
          git add -f docs/testing/evidence/emulator || true
          if git diff --cached --quiet; then
            echo "no evidence changes to publish"
            exit 0
          fi
          git commit -m "ui validation: emulator run evidence [skip ci]"
          for attempt in 1 2 3 4 5; do
            # Another job may commit while this one is booting an emulator; rebase and retry, and
            # fail loudly rather than reporting success after silently losing the evidence.
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase --autostash "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "evidence pushed on attempt $attempt"
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -d' ' -f1)"
              if [ "$local_sha" = "$remote_sha" ]; then
                echo "::notice title=Evidence::pushed $local_sha"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::evidence could not be pushed after 5 attempts"
          exit 1
