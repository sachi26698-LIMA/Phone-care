name: Android debug APK

# Builds the real APK on GitHub's runners, where the Android SDK and Gradle exist.
# Nothing is published: the APK is uploaded as a workflow artifact and expires.

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The emulator job below needs to commit its screenshots; that is granted per job, not globally.

jobs:
  build-debug-apk:
    name: Test, build and verify the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No third-party SDK action: ubuntu runners ship the SDK and cmdline-tools.
      # If they ever stop shipping it, the fallback fetches Google's cmdline-tools.
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then
                ANDROID_HOME="$candidate"
                break
              fi
            done
          fi
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found; downloading cmdline-tools" >&2
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Summarise unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          tests = failures = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"::notice title=Unit tests::tests={tests} failures={failures} skipped={skipped}")
          print(f"unit tests: {tests} tests, {failures} failures, {skipped} skipped")
          if failures:
              raise SystemExit(1)
          PY

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify the APK
        run: |
          set -uo pipefail
          : "${ANDROID_HOME:?Android SDK not configured}"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::no APK at $APK"
            ls -R app/build/outputs || true
            exit 1
          fi

          ls -l "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "::notice title=APK artifact::sha256=$SHA size=$SIZE bytes path=$APK"

          "$BT/aapt2" dump badging "$APK" | tee apk-badging.txt || true
          unzip -l "$APK" | tee apk-contents.txt || true
          "$BT/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt 2>&1 || true
          cat apk-signature.txt

          status=0
          expect() { # file, fixed-pattern, label
            if grep -qF -- "$2" "$1"; then
              echo "ok: $3"
            else
              echo "::error::APK verification failed: $3 not found in $1"
              echo "::notice::$3 pattern was: $2"
              sed -n '1,40p' "$1" | while IFS= read -r line; do echo "::notice::  $line"; done
              status=1
            fi
          }
          expect apk-badging.txt "package: name='app.phonecare.diagnostics'" "package name"
          expect apk-badging.txt "minSdkVersion:'26'" "minSdk 26"
          expect apk-badging.txt "targetSdkVersion:'35'" "targetSdk 35"
          expect apk-badging.txt "launchable-activity: name='app.phonecare.diagnostics.MainActivity'" "launcher activity"
          expect apk-contents.txt "classes.dex" "classes.dex in the archive"
          expect apk-contents.txt "resources.arsc" "resources.arsc in the archive"
          expect apk-signature.txt "Verified using v2 scheme (APK Signature Scheme v2): true" "v2 signature"
          expect apk-signature.txt "Verifies" "apksigner overall verdict"
          exit "$status"

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonecare-debug-apk
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/apk-sha256.txt
            native/android/apk-badging.txt
            native/android/apk-contents.txt
            native/android/apk-signature.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: native/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

  ui-walk:
    name: Walk every screen on an emulator
    # Physical-device testing is impossible in CI, so this boots a real Android emulator,
    # installs the APK the job above just built, walks all 24 screens with uiautomator and
    # commits the screenshots. It is emulator evidence, not a handset.
    needs: build-debug-apk
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: native/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK from the build job
        uses: actions/download-artifact@v4
        with:
          name: phonecare-debug-apk
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Walk the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none
          # Absolute paths: the action runs this from its own working directory, so a bare
          # `cd native/android` silently misses and python exits 2 without doing anything.
          script: |
            echo "cwd=$(pwd) workspace=$GITHUB_WORKSPACE"
            cd "$GITHUB_WORKSPACE/native/android" || exit 3
            echo "walking from $(pwd)"; ls -l ui-walk.py
            python3 -u ui-walk.py > "$GITHUB_WORKSPACE/walk.log" 2>&1
            rc=$?
            cat "$GITHUB_WORKSPACE/walk.log"
            exit $rc

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-walk
          path: docs/testing/evidence/emulator
          if-no-files-found: warn
          retention-days: 30

      # Logs from this job are not retrievable through the API afterwards, so the raw output is
      # committed with the screenshots. A failed walk is still diagnosable from the branch.
      - name: Collect the raw walk log
        if: always()
        working-directory: .
        run: |
          mkdir -p docs/testing/evidence/emulator
          if [ -f walk.log ]; then
            cp walk.log docs/testing/evidence/emulator/walk-raw.log
          else
            echo "walk.log missing: the walk script never started" \
              > docs/testing/evidence/emulator/walk-raw.log
          fi
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path("docs/testing/evidence/emulator/walk-raw.log").read_text(
              errors="replace").splitlines()
          fails = [ln for ln in lines if ln.startswith("[FAIL]")]
          notes = [ln for ln in lines if ln.startswith("::notice")]
          print(f"::notice title=UI walk::log lines={len(lines)} fails={len(fails)}")
          for line in (fails + notes)[:8]:
              print(f"::notice title=walk::{line[:350]}")
          for line in lines[-6:]:
              print(f"::notice title=tail::{line[:350]}")
          PY

      - name: Publish evidence back to the branch
        if: always()
        working-directory: .
        run: |
          git config user.name "phonecare-ci"
          git config user.email "ci@phonecare.invalid"
          git add -f docs/testing/evidence/emulator || true
          if git diff --cached --quiet; then
            echo "no evidence changes to publish"
          else
            git commit -m "ui validation: emulator screenshots and walk report [skip ci]"
            git push
          fi
