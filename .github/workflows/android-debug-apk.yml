name: Android debug APK

# Builds the real APK on GitHub's runners, where the Android SDK and Gradle exist.
# Nothing is published: the APK is uploaded as a workflow artifact and expires.

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Test, build and verify the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify the APK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK not configured}"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "no APK produced"; exit 1; }

          ls -l "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='app.phonecare.diagnostics'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt
          grep -q "launchable-activity: name='app.phonecare.diagnostics.MainActivity'" apk-badging.txt

          unzip -l "$APK" | tee apk-contents.txt
          grep -q "classes.dex" apk-contents.txt
          grep -q "resources.arsc" apk-contents.txt

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee apk-signature.txt
          grep -q "Verified using v2 scheme" apk-signature.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: phonecare-debug-apk
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/apk-sha256.txt
            native/android/apk-badging.txt
            native/android/apk-contents.txt
            native/android/apk-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: native/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
