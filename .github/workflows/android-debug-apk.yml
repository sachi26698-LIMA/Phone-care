name: Android debug APK

# Builds the real APK on GitHub's runners, where the Android SDK and Gradle exist.
# Nothing is published: the APK is uploaded as a workflow artifact and expires.

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Test, build and verify the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No third-party SDK action: ubuntu runners ship the SDK and cmdline-tools.
      # If they ever stop shipping it, the fallback fetches Google's cmdline-tools.
      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then
                ANDROID_HOME="$candidate"
                break
              fi
            done
          fi
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found; downloading cmdline-tools" >&2
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify the APK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK not configured}"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "no APK produced"; exit 1; }

          ls -l "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='app.phonecare.diagnostics'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt
          grep -q "launchable-activity: name='app.phonecare.diagnostics.MainActivity'" apk-badging.txt

          unzip -l "$APK" | tee apk-contents.txt
          grep -q "classes.dex" apk-contents.txt
          grep -q "resources.arsc" apk-contents.txt

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee apk-signature.txt
          grep -q "Verified using v2 scheme" apk-signature.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: phonecare-debug-apk
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/apk-sha256.txt
            native/android/apk-badging.txt
            native/android/apk-contents.txt
            native/android/apk-signature.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: native/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
