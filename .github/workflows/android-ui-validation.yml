name: Android UI validation (emulator)

# There is no physical handset attached to CI, so this job boots a real Android emulator,
# installs the same debug APK, walks all 24 screens with uiautomator, screenshots each one and
# commits the evidence to docs/testing/evidence/emulator/.
#
# It is emulator evidence. It is NOT a substitute for the physical-device pass in
# docs/testing/DEVICE-VALIDATION-REPORT.md, and the reports say so.

on:
  workflow_dispatch:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "native/android/ui-walk.py"
      - ".github/workflows/android-ui-validation.yml"

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  emulator-walk:
    name: Walk 24 screens on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: native/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then ANDROID_HOME="$candidate"; break; fi
            done
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "SDK at $ANDROID_HOME"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Walk the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none
          script: |
            cd native/android
            python3 ui-walk.py

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-walk
          path: |
            docs/testing/evidence/emulator
            native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish evidence back to the branch
        if: always()
        run: |
          git config user.name "phonecare-ci"
          git config user.email "ci@phonecare.invalid"
          git add docs/testing/evidence/emulator || true
          if git diff --cached --quiet; then
            echo "no evidence changes to publish"
          else
            git commit -m "ui validation: emulator screenshots and walk report [skip ci]"
            git push
          fi
